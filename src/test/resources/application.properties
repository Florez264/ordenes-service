spring.datasource.url=jdbc:h2:mem:ordenes;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
taller.aseguradoras-integradas=INTEGRADA_DEMO

spring.flyway.locations=classpath:db/migration
spring.flyway.user=sa
spring.flyway.password=
taller.auth.asesores[0].usuario=asesor
taller.auth.asesores[0].password=asesor-local-password
taller.internal.usuario=agenda-internal
taller.internal.password=internal-local-password
