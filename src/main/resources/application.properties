spring.application.name=ordenes-service
spring.profiles.default=local
server.port=${PORT:${SERVER_PORT:8081}}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.root=INFO
taller.aseguradoras-integradas=${INTEGRATED_INSURERS:}

spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
taller.auth.asesores[0].usuario=${API_USER}
taller.auth.asesores[0].password=${API_PASSWORD}
taller.internal.usuario=${INTERNAL_USER}
taller.internal.password=${INTERNAL_PASSWORD}

taller.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
