spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Usar URL JDBC con TLS y credenciales del entorno.

# Cloud: únicamente variables externas; no importa .env.local.
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASSWORD}

# Perfil inicial para demostracion con pocos recursos; medir antes de reducir mas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:2}
spring.datasource.hikari.keepalive-time=0
server.tomcat.threads.max=${HTTP_MAX_THREADS:16}
server.tomcat.threads.min-spare=1
server.tomcat.accept-count=32
spring.lifecycle.timeout-per-shutdown-phase=10s
